<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>お天気アプリ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@300;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="sky-partly">
  <header>
    <h1>お天気アプリ</h1>
  </header>

  <main>
    <!-- 検索欄はステップ2(#6)で追加する。今は東京固定 -->
    <section class="weather-card">
      <p class="city" id="city">--</p>
      <p class="fetched-at" id="fetched-at"></p>
      <div class="current">
        <span class="weather-icon" id="weather-icon"></span>
        <span class="temperature"><span id="temperature">--</span><span class="unit">℃</span></span>
      </div>
      <p class="label-row"><span class="weather-label" id="weather-label">--</span></p>
      <p class="wind">風速 <span id="wind-speed">--</span> m/s</p>
    </section>
    <!-- 週間予報はステップ3(#7)でここに追加する -->
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
